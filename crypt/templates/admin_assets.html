{% extends "layout.html" %}
{% block title %}Manage User Assets{% endblock %}

{% block content %}
<h2>User Assets Management</h2>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>User Email</th>
            <th>Currency</th>
            <th>Balance</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for asset in assets %}
        <tr>
            <td>{{ asset.user.email }}</td>
            <td>{{ asset.currency }}</td>
            <td>{{ "%.8f"|format(asset.balance) }}</td>
            <td>
                <a href="{{ url_for('edit_asset', asset_id=asset.id) }}">Edit</a> |
                <form method="POST" action="{{ url_for('delete_asset', asset_id=asset.id) }}" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this asset?');">
                    <button type="submit" style="color:red; border:none; background:none;">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
